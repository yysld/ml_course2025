name: Deploy VitePress site to Pages

on:
  push:
    branches: [main] # 确保你的分支名是 main，如果是 master 请改成 master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build with VitePress
        # 注意：这里假设你的 package.json 里有一个叫 docs:build 的脚本
        # 如果你平时是敲 npm run build 来打包，这里就改成 npm run build
        run: npm run docs:build 

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist 
          # 注意：如果你的源码在 docs 目录下，这里通常是 docs/.vitepress/dist
          # 请根据你平时本地打包后生成的 dist 文件夹位置来填

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4